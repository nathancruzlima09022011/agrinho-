<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Memória - Agrinho 2026</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(to bottom,#4CAF50,#8BC34A);
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
}

h1{
    margin:20px;
}

#game{
    display:grid;
    grid-template-columns:repeat(3, 120px);
    grid-gap:15px;
    justify-content:center;
}

.card{
    width:120px;
    height:120px;
    background:white;
    color:black;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
    border-radius:15px;
    cursor:pointer;
    user-select:none;
    transition: transform 0.3s;
}

.card.flipped{
    background:#FFEB3B;
    transform: rotateY(180deg);
}

button{
    margin:20px;
    padding:10px 25px;
    border:none;
    border-radius:10px;
    font-size:1rem;
    cursor:pointer;
    background:#4CAF50;
    color:white;
}

button:hover{
    background:#388E3C;
}

#message{
    margin-top:20px;
    font-size:1.2rem;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>🌱 Jogo da Memória - Agrinho 2026</h1>

<div id="game"></div>

<button onclick="startGame()">Reiniciar Jogo</button>

<div id="message"></div>

<script>
const cardsArray = [
'🌾','🌾',
'🍎','🍎',
'🥕','🥕',
'🐄','🐄',
'🌻','🌻',
'🚜','🚜'
];

let firstCard = null;
let secondCard = null;
let lockBoard = false;
let matches = 0;

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function startGame(){
    matches = 0;
    firstCard = null;
    secondCard = null;
    lockBoard = false;
    document.getElementById('message').innerText = '';
    
    const gameBoard = document.getElementById('game');
    gameBoard.innerHTML = '';
    
    const shuffled = shuffle([...cardsArray]);
    
    shuffled.forEach(symbol=>{
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.symbol = symbol;
        card.innerText = '';
        card.addEventListener('click', flipCard);
        gameBoard.appendChild(card);
    });
}

function flipCard(){
    if(lockBoard) return;
    if(this === firstCard) return;

    this.classList.add('flipped');
    this.innerText = this.dataset.symbol;

    if(!firstCard){
        firstCard = this;
        return;
    }

    secondCard = this;
    checkMatch();
}

function checkMatch(){
    if(firstCard.dataset.symbol === secondCard.dataset.symbol){
        matches++;
        firstCard.removeEventListener('click', flipCard);
        secondCard.removeEventListener('click', flipCard);
        resetTurn();
        if(matches === cardsArray.length/2){
            document.getElementById('message').innerText = '🎉 Parabéns! Você encontrou todos os pares!';
        }
    }else{
        lockBoard = true;
        setTimeout(()=>{
            firstCard.classList.remove('flipped');
            secondCard.classList.remove('flipped');
            firstCard.innerText = '';
            secondCard.innerText = '';
            resetTurn();
        },1000);
    }
}

function resetTurn(){
    [firstCard, secondCard] = [null, null];
    lockBoard = false;
}

startGame();
</script>

</body>
</html>
